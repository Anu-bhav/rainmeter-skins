[DownloadText1]
Meter=String
; FontFace=#FontFace#
FontFace=Wingdings 3
StringStyle=Bold
FontColor=#FontColor1#
FontSize=17
X=0
Y=95
Text="q"
AntiAlias=1

[UploadText1]
