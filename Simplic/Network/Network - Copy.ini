LineWidth=4
AutoScale=1
AntiAlias=1

[UploadHistogram]
Meter=Line
MeasureName=mNetworkOut
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AutoScale=1
AntiAlias=1

