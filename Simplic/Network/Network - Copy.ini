[Rainmeter]
Update=1000
Author= - HipHopium -
DynamicWindowSize=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
;-------------------------------------------------------------

[mNetworkIn]
Measure=NetIn
AverageSize=5
UseBits=1

[mNetworkInText]
Measure=NetIn
AverageSize=5
UseBits=1
Substitute="0":"O"

[mNetworkOut]
Measure=NetOut
AverageSize=5
UseBits=1

[mNetworkOutText]
Measure=NetOut
AverageSize=5
UseBits=1
Substitute="0":"O"

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
;-------------------------------------------------------------

[DownloadText]
Meter=String
MeasureName=mNetworkInText
FontFace=#FontFace#
FontColor=#FontColor1#
FontSize=11
StringStyle=Bold
X=37
Y=100
AutoScale=1
Text=%1bps
AntiAlias=1

[UploadText]
Meter=String
MeasureName=mNetworkOutText
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=11
StringStyle=Bold
X=164
Y=100
AutoScale=1
Text=%1bps
AntiAlias=1

