[Rainmeter]
Update=1000
Author= - Custom Minimal -
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc

; --- Overall GPU usage, read from NVML via the SimplicGpu plugin ---
; No external process, no temp files. nvidia-smi is not used at runtime.
GpuPct=0
VramUsedMiB=0
VramTotalMiB=1

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; Overall GPU load (percent), drives the graph and the readout
[mGpuPct]
Measure=Plugin
Plugin=SimplicGpu
Metric=Usage
MinValue=0
MaxValue=100

; Video RAM in use, bytes
[mVramUsed]
Measure=Plugin
Plugin=SimplicGpu
Metric=VramUsed

; Total video RAM, bytes
[mVramTotal]
Measure=Plugin
Plugin=SimplicGpu
Metric=VramTotal

; Video RAM used, converted bytes -> GiB
[mVramGB]
Measure=Calc
Formula=(mVramUsed / 1073741824)

; Video RAM used as a percentage of the card's total
[mVramPercent]
Measure=Calc
Formula=(mVramUsed / mVramTotal * 100)
MinValue=0
MaxValue=100

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; SPEEDS & USAGE (String Meters)
;-------------------------------------------------------------

[GPUText]
Meter=String
MeasureName=mGpuPct
FontFace=#FontFace#
FontColor=#FontColor1#
FontSize=11
StringStyle=Bold
X=65
Y=100
Text="%1%"
AntiAlias=1

; Uses Section Variables to format decimals individually
[VRAMText]
Meter=String
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=11
StringStyle=Bold
X=135
Y=100
Text="[mVramGB:1]GB ([mVramPercent:0]%)"
DynamicVariables=1
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS (Dynamic Scaling Enabled)
;-------------------------------------------------------------

; 1. Shaded area fills (Drawn first)
[GPUHistogramArea]
Meter=Histogram
MeasureName=mGpuPct
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[VRAMHistogramArea]
Meter=Histogram
MeasureName=mVramPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AutoScale=1
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[GPUHistogram]
Meter=Line
MeasureName=mGpuPct
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=1
AntiAlias=1

[VRAMHistogram]
Meter=Line
MeasureName=mVramPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AutoScale=1
AntiAlias=1

;-------------------------------------------------------------
; LABELS
;-------------------------------------------------------------

[GPUIcon]
Meter=String
FontFace=#FontFace#
StringStyle=Bold
FontColor=#FontColor1#
FontSize=11
X=30
Y=100
Text="GPU"
AntiAlias=1

[VRAMIcon]
Meter=String
FontFace=#FontFace#
StringStyle=Bold
FontColor=#FontColor2#
FontSize=11
X=100
Y=100
Text="VRAM"
AntiAlias=1