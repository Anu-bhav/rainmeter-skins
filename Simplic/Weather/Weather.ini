[Rainmeter]
Update=500
Author= -HipHopium- (Fixed for new API)
DynamicVariables=1

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\#Language#.inc
; Local secrets (weather API key). Gitignored - see Secrets.example.inc.
@include3=#@#Secrets.inc

[Style]
FontColor=#FontColor1#
FontFace=#FontFace#
AntiAlias=1

;-------------------------------------------------------------
; MEASURES (Updated to modern Weather.com API)
;-------------------------------------------------------------

; Translates your Unit variable to the format the API expects (m = metric, e = english)
[MeasureUnit]
Measure=String
String=#Unit#
Substitute="f":"e","m":"m","c":"m"

; 1. Gets Latitude and Longitude based on your City Name
[mLocation]
Measure=WebParser
Url=https://api.weather.com/v3/location/search?query=#Location#&locationType=locale&language=en-US&format=json&apiKey=#WeatherAPIKey#
RegExp="(?siU)"latitude":\[(.*)(?:,|\]).*"longitude":\[(.*)(?:,|\])"
UpdateRate=3600
FinishAction=[!CommandMeasure mCurrent "Update"][!CommandMeasure mToday "Update"]

[mLat]
Measure=WebParser
Url=[mLocation]
StringIndex=1

[mLon]
Measure=WebParser
Url=[mLocation]
StringIndex=2

; 2. Gets Current Weather using the coordinates
[mCurrent]
Measure=WebParser
Url=https://api.weather.com/v3/wx/observations/current?geocode=[&mLat],[&mLon]&units=[&MeasureUnit]&language=en-US&format=json&apiKey=#WeatherAPIKey#
RegExp="(?siU)"iconCode":(.*),.*"temperature":(.*),.*"wxPhraseLong":"(.*)"
UpdateRate=1800
DynamicVariables=1
Disabled=1

[mIconCurrent]
Measure=WebParser
Url=[mCurrent]
StringIndex=1

[mTempCurrent]
Measure=WebParser
Url=[mCurrent]
StringIndex=2

[mConditionsCurrent]
Measure=WebParser
Url=[mCurrent]
StringIndex=3
Substitute=#Conditions#

; 3. Gets Forecast (High and Low temps)
[mToday]
Measure=WebParser
Url=https://api.weather.com/v3/wx/forecast/daily/5day?geocode=[&mLat],[&mLon]&units=[&MeasureUnit]&language=en-US&format=json&apiKey=#WeatherAPIKey#
RegExp="(?siU)"temperatureMax":\[(.*)(?:,|\]).*"temperatureMin":\[(.*)(?:,|\])"
UpdateRate=1800
DynamicVariables=1
Disabled=1

[mHighTemp]
Measure=WebParser
Url=[mToday]
StringIndex=1

[mLowTemp]
Measure=WebParser
Url=[mToday]
StringIndex=2

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=150
W=450
H=1
SolidColor=255,255,255
Group=Current

[MeterCurrentIcon]
MeasureName=mIconCurrent
Meter=Image
ImagePath=#@#WeatherIcons
PreserveAspectRatio=1
X=170
Y=0
W=120
Group=Current

[MeterTempCurrent]
MeasureName=mTempCurrent
Meter=String
MeterStyle=Style
X=70
Y=70
FontColor=#FontColor2#
FontSize=48
StringAlign=Center
Text="%1?"
Group=Current

[MeterConditionsCurrent]
MeasureName=mConditionsCurrent
Meter=String
MeterStyle=Style
X=225
Y=165
W=440
H=40
FontColor=#FontColor2#
FontSize=20
StringAlign=Center
ClipString=1
Group=Current

[MeterLow]
Meter=String
MeasureName=mLowTemp
MeterStyle=Style
X=115
Y=115
FontSize=14
Text=%1?
Group=Current
Prefix="#Low#: "

[MeterHigh]
Meter=String
MeasureName=mHighTemp
MeterStyle=Style
X=255
Y=115
FontSize=14
Text=%1?
Group=Current
Prefix="#High#: "

;-------------------------------------------------------------
; SETTINGS UI
;-------------------------------------------------------------

[Background]
Meter=Image
ImageName=#@#SettingsBg.png
X=40
Y=20
W=380
H=250
Hidden=1
Group=Settings
AntiAlias=1

[SettingsIconBackground]
Meter=IMAGE
SolidColor=0,0,0,1
X=0
Y=0
W=460
H=200
MouseOverAction=[!ShowMeter "SettingsIcon"] 
MouseLeaveAction=[!HideMeter "SettingsIcon"]
Group=Current

[SettingsIcon]
Meter=Image
ImageName=#@#Settings.png
X=410
Y=60
W=25
ToolTipText=Settings.
LeftMouseUpAction=[!WriteKeyValue Variables Hidden "0" "#@#Variables.inc"][!HideMeterGroup Current][!ShowMeterGroup Settings][!Redraw]
AntiAlias=1
Hidden=1
Group=Current

[WeatherCode]
Meter=String
StringAlign=Left
FontColor=255,255,255
FontFace=Segoe UI Light
FontSize=14
X=40
Y=80
Text=Enter City Name Here ->
Hidden=1
AntiAlias=1
Group=Settings

[MeterCode]
Meter=String
StringAlign=Center
FontFace=Segoe UI Light
FontColor=0,174,239
FontSize=15
X=310r
Y=0r
Text=#Location#
AntiAlias=1
Hidden=1
Group=Settings
ToolTipText=Type your City Name (e.g. Poste de Flacq) and press the "Enter" key to Apply changes.
LeftMouseUpAction=[!PluginBang "meterInput ExecuteBatch 1"]

[MeterInput]
Measure=Plugin
Plugin=InputText.dll
X=300
Y=84
W=110
H=20
Hidden=1
Group=Settings
StringAlign=Left
FontFace=Segoe UI Light
AntiAlias=1
FontSize=14
FocusDismiss=1
Command1=[!WriteKeyValue Variables Location "$UserInput$""#@#Variables.inc"][!Refresh *] 
DefaultValue="#Location#"

[LocationFind]
Meter=String
StringAlign=Left
FontFace=Segoe UI Light
FontColor=255,255,255
FontSize=14
X=40
Y=50
Text=Use City Name or Zip Code -> 
Hidden=1
AntiAlias=1
Group=Settings

[LocationCode]
Meter=Image
ImageName=#@#Location.png
X=265r
Y=-8r
W=44
AntiAlias=1
Hidden=1
Group=Settings
ToolTipText="Search by City Name, Zip Code, or Coordinates."
LeftMouseDownAction=["https://weather.com/"]

[weatherLang]
Meter=String
StringAlign=Left
FontFace=Segoe UI Light
FontColor=255,255,255
FontSize=15
X=40
Y=110
Text=Enter Language Here -> 
AntiAlias=1
Hidden=1
Group=Settings

[meterCode2]
Meter=String
StringAlign=Center
FontColor=0,174,239
FontSize=15
X=300r
Y=5r
Text=#Language#
AntiAlias=1
Hidden=1
Group=Settings
ToolTipText=Type your "Language" and press the "Enter" key to Apply changes.#CRLF#Supported languages for now:Czech,English,French,German,Greek,#CRLF#Italian,Polish,Russian,Serbian,Spanish,Turkish,Portuguese.
LeftMouseUpAction=[!PluginBang "meterInput2 ExecuteBatch 1"]

[meterInput2]
Measure=Plugin
Plugin=InputText.dll
X=300
Y=115
W=110
H=22
Hidden=1
Group=Settings
StringAlign=Left
FontSize=14
FocusDismiss=1
AntiAlias=1
Command1=[!WriteKeyValue Variables Language "$UserInput$""#@#Variables.inc"][!Refresh *] 
DefaultValue="#Language#"

[Celsius]
Meter=Image
ImageName=#@#Celsius.png
X=80
Y=180
W=95
Hidden=1
Group=Settings
LeftMouseUpAction=[!WriteKeyValue Variables Unit "m" "#@#Variables.inc"][!Refresh]

[Fahrenheit]
Meter=Image
ImageName=#@#Fahrenheit.png
X=280
Y=180
W=95
Hidden=1
Group=Settings
LeftMouseUpAction=[!WriteKeyValue Variables Unit "e" "#@#Variables.inc"][!Refresh][!HideMeter Fahrenheit]

[Close]
Meter=Image
ImageName=#@#Close.png
X=180
Y=220
W=95
PreserveAspectRatio=1
Hidden=1
Group=Settings
LeftMouseUpAction=[!ShowMeterGroup Current][!HideMeterGroup Settings][!Redraw]

[Instruction]
Meter=String
MeterStyle=Style
FontFace=Segoe UI Light
FontColor=255,255,255
FontSize=15
X=40
Y=140
Text=Translate Instruction -> 
Hidden=1
Group=Settings

[BookImage]
Meter=IMAGE
ImageName=#@#Book.png
PreserveAspectRatio=1
X=265r
Y=r
W=26
Group=Settings
Hidden=1
ToolTipText="Click here to see how to translate to your language"
LeftMouseUpAction=!Execute ["#ROOTCONFIGPATH#@Resources\Language\YourLanguage.inc"]