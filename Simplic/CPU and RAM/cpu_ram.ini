[Rainmeter]
Update=1000
Author= - Custom Minimal -
DynamicWindowSize=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; Measures aggregate average CPU load across all 32 logical threads
[mCPU]
Measure=CPU

; Measures actual bytes of RAM used
[mRAMBytes]
Measure=PhysicalMemory

; Measures total usable RAM capacity on the system (approx. 63.8 GB)
[mRAMTotal]
Measure=PhysicalMemory
Total=1

; Converts your used RAM bytes into Gigabytes (Bytes / 1024^3)
[mRAMGB]
Measure=Calc
Formula=(mRAMBytes / 1073741824)

; Mathematically calculates your RAM percentage
[mRAMPercent]
Measure=Calc
Formula=(mRAMBytes / mRAMTotal * 100)

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; SPEEDS & USAGE (String Meters)
;-------------------------------------------------------------

[CPUText]
Meter=String
MeasureName=mCPU
FontFace=#FontFace#
FontColor=#FontColor1#
FontSize=11
StringStyle=Bold
X=65
Y=100
Text="%1%"
AntiAlias=1

; Uses Section Variables to format decimals individually
[RAMText]
Meter=String
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=11
StringStyle=Bold
X=135
Y=100
Text="[mRAMGB:1]GB ([mRAMPercent:0]%)"
DynamicVariables=1
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS (Dynamic Scaling Enabled)
;-------------------------------------------------------------

; 1. Shaded area fills (Drawn first)
[CPUHistogramArea]
Meter=Histogram
MeasureName=mCPU
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[RAMHistogramArea]
Meter=Histogram
MeasureName=mRAMPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AutoScale=1
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[CPUHistogram]
Meter=Line
MeasureName=mCPU
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=1
AntiAlias=1

[RAMHistogram]
Meter=Line
MeasureName=mRAMPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AutoScale=1
AntiAlias=1

;-------------------------------------------------------------
; LABELS
;-------------------------------------------------------------

[CPUIcon]
Meter=String
FontFace=#FontFace#
StringStyle=Bold
FontColor=#FontColor1#
FontSize=11
X=30
Y=100
Text="CPU"
AntiAlias=1

[RAMIcon]
Meter=String
FontFace=#FontFace#
StringStyle=Bold
FontColor=#FontColor2#
FontSize=11
X=100
Y=100
Text="RAM"
AntiAlias=1