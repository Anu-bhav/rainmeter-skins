[Rainmeter]
Update=1000
Author= - Custom Minimal -
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; Overall GPU load (percent)
[mGpuPct]
Measure=Plugin
Plugin=SimplicGpu
Metric=Usage
MinValue=0
MaxValue=100

; Video RAM in use, bytes
[mVramUsed]
Measure=Plugin
Plugin=SimplicGpu
Metric=VramUsed

; Total video RAM, bytes
[mVramTotal]
Measure=Plugin
Plugin=SimplicGpu
Metric=VramTotal

; Video RAM used, bytes -> GiB
[mVramGB]
Measure=Calc
Formula=(mVramUsed / 1073741824)

; Total video RAM, bytes -> GiB
[mVramTotalGB]
Measure=Calc
Formula=(mVramTotal / 1073741824)

; Video RAM used as a percentage of the card's total
[mVramPercent]
Measure=Calc
Formula=(mVramUsed / mVramTotal * 100)
MinValue=0
MaxValue=100

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; READOUT
;-------------------------------------------------------------
; Both values are centred as a pair across the full 250px width:
; the left group is centred on the 1/4 line and the right group on the
; 3/4 line, so the pair as a whole is always centred no matter how
; many digits each value happens to have.

; Left: overall GPU load
[GPUText]
Meter=String
MeasureName=mGpuPct
FontFace=#FontFace#
FontColor=#FontColor1#
FontSize=11
StringStyle=Bold
StringAlign=Center
X=62
Y=100
Text="GPU %1%"
AntiAlias=1

; Right: VRAM as "used/total", which reads unambiguously as memory
[VRAMText]
Meter=String
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=11
StringStyle=Bold
StringAlign=Center
X=187
Y=100
Text="VRAM [mVramGB:1]/[mVramTotalGB:0]GB"
DynamicVariables=1
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS
;-------------------------------------------------------------
; AutoScale is used where the metric is genuinely dynamic (GPU load) so
; small changes stay visible. VRAM is excluded because it sits nearly
; constant - AutoScale would rescale to its own min/max every frame and
; pin the line to the top, making 12% look full. Fixed 0-100 keeps 12%
    ; looking like 12%.

; 1. Shaded area fills (Drawn first)
[GPUHistogramArea]
Meter=Histogram
MeasureName=mGpuPct
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[VRAMHistogramArea]
Meter=Histogram
MeasureName=mVramPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[GPUHistogram]
Meter=Line
MeasureName=mGpuPct
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=1
AntiAlias=1

[VRAMHistogram]
Meter=Line
MeasureName=mVramPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AntiAlias=1

;-------------------------------------------------------------
; LABELS are inline with the values above, so there are no
; separate icon meters - this keeps the pair centred as one unit.
-------------------------------------------------------------