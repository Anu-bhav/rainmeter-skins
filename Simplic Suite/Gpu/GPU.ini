[Rainmeter]
Update=1000
Author=Anu-Bhav ; https://github.com/Anu-bhav/rainmeter-skins
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; Overall GPU load (percent)
[mGpuPct]
Measure=Plugin
Plugin=SimplicGpu
Metric=Usage
MinValue=0
MaxValue=100

; Video RAM in use, bytes
[mVramUsed]
Measure=Plugin
Plugin=SimplicGpu
Metric=VramUsed

; Total video RAM, bytes
[mVramTotal]
Measure=Plugin
Plugin=SimplicGpu
Metric=VramTotal

; Video RAM used, bytes -> GiB
[mVramGB]
Measure=Calc
Formula=(mVramUsed / 1073741824)

; Total video RAM, bytes -> GiB
[mVramTotalGB]
Measure=Calc
Formula=(mVramTotal / 1073741824)

; Video RAM used as a percentage of the card's total
[mVramPercent]
Measure=Calc
Formula=(mVramUsed / mVramTotal * 100)
MinValue=0
MaxValue=100

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; READOUT
;-------------------------------------------------------------
; A single centred String meter, so the whole line is centred by
; construction. Centring two separate meters on their own quarter points
; does NOT centre the pair: "GPU 9%" is narrow while "VRAM 1.5/12GB" is
; wide, so the visual block drifts right of centre.
;
; X=125 is the centre of the 250px skin. Inline colour recolours the
; second half magenta without needing a second meter.

[Readout]
Meter=String
MeasureName=mGpuPct
MeasureName2=mVramGB
MeasureName3=mVramTotalGB
FontFace=#FontFace#
FontSize=11
StringStyle=Bold
FontColor=#FontColor1#
StringAlign=Center
X=125
Y=100
DynamicVariables=1
Text="GPU %1%    VRAM %2.1f/%3.0fGB"
InlineSetting=Color | #FontColor2#
InlinePattern=VRAM.*
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS
;-------------------------------------------------------------
; AutoScale is used where the metric is genuinely dynamic (GPU load) so
; small changes stay visible. VRAM is excluded because it sits nearly
; constant - AutoScale would rescale to its own min/max every frame and
; pin the line to the top, making 12% look full. Fixed 0-100 keeps 12%
    ; looking like 12%.

; 1. Shaded area fills (Drawn first)
[GPUHistogramArea]
Meter=Histogram
MeasureName=mGpuPct
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[VRAMHistogramArea]
Meter=Histogram
MeasureName=mVramPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[GPUHistogram]
Meter=Line
MeasureName=mGpuPct
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=1
AntiAlias=1

[VRAMHistogram]
Meter=Line
MeasureName=mVramPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AntiAlias=1

;-------------------------------------------------------------
; LABELS are inline with the values above, so there are no
; separate icon meters - this keeps the pair centred as one unit.
-------------------------------------------------------------