[Rainmeter]
Update=1000
Author= - Custom Minimal -
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; GPU temperature in degrees Celsius, straight from NVIDIA NVML
; through SimplicGpu (nvml.dll in-process)
[mGPUTemp]
Measure=Plugin
Plugin=SimplicGpu
Metric=Temp
MinValue=0
MaxValue=100

; CPU temperature in degrees Celsius, via CoreTemp
[mCPUTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=Temperature
CoreTempIndex=0
MinValue=0
MaxValue=100

; Temperature fraction on a true 0-100C scale (1.0 = 100C = full graph height)
[mGPUTempFrac]
Measure=Calc
Formula=(mGPUTemp / 100)
MinValue=0
MaxValue=1

[mCPUTempFrac]
Measure=Calc
Formula=(mCPUTemp / 100)
MinValue=0
MaxValue=1

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

; 2px divider under the graph, same as the other Simplic Suite widgets
[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; READOUT
;-------------------------------------------------------------
; One centred String meter for both temperatures, so the pair is
; centred by construction. The GPU half is cyan (FontColor1), the CPU
; half is recoloured magenta (FontColor2) through the inline setting;
; no second meter needed, so the pair stays centred as one unit.

[Readout]
Meter=String
MeasureName=mGPUTemp
MeasureName2=mCPUTemp
FontFace=#FontFace#
FontSize=11
StringStyle=Bold
FontColor=#FontColor1#
StringAlign=Center
X=125
Y=100
DynamicVariables=1
Text="GPU %1°C    CPU %2°C"
InlineSetting=Color | #FontColor2#
InlinePattern=CPU.*
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS
;-------------------------------------------------------------
; GPU temperature history (cyan)
[GPUHistogramArea]
Meter=Histogram
MeasureName=mGPUTempFrac
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=0
AntiAlias=1

[GPUHistogram]
Meter=Line
MeasureName=mGPUTempFrac
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=0
AntiAlias=1

; CPU temperature history (magenta)
[CPUHistogramArea]
Meter=Histogram
MeasureName=mCPUTempFrac
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AutoScale=0
AntiAlias=1

[CPUHistogram]
Meter=Line
MeasureName=mCPUTempFrac
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AutoScale=0
AntiAlias=1

;-------------------------------------------------------------
; LABELS are inline with the values above, so there are no
; separate icon meters - this keeps the pair centred as one unit.
;-------------------------------------------------------------