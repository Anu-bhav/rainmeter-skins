[Rainmeter]
Update=1000
Author= - Custom Minimal -
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; Measures aggregate average CPU load across all logical threads
[mCPU]
Measure=CPU

; Measures actual bytes of RAM used
[mRAMBytes]
Measure=PhysicalMemory

; Measures total usable RAM capacity on the system
[mRAMTotal]
Measure=PhysicalMemory
Total=1

; Used RAM, bytes -> GiB
[mRAMGB]
Measure=Calc
Formula=(mRAMBytes / 1073741824)

; Total RAM, bytes -> GiB
[mRAMTotalGB]
Measure=Calc
Formula=(mRAMTotal / 1073741824)

; RAM used as a percentage of the total
[mRAMPercent]
Measure=Calc
Formula=(mRAMBytes / mRAMTotal * 100)
MinValue=0
MaxValue=100

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; READOUT
;-------------------------------------------------------------
; Both values are centred as a pair across the full 250px width:
; the left group is centred on the 1/4 line and the right group on the
; 3/4 line, so the pair as a whole is always centred no matter how
; many digits each value happens to have.

; Left: overall CPU load
[CPUText]
Meter=String
MeasureName=mCPU
FontFace=#FontFace#
FontColor=#FontColor1#
FontSize=11
StringStyle=Bold
StringAlign=Center
X=62
Y=100
Text="CPU %1%"
AntiAlias=1

; Right: RAM as "used/total", matching the GPU widget's shape so both
; read as memory rather than as a second percentage.
[RAMText]
Meter=String
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=11
StringStyle=Bold
StringAlign=Center
X=187
Y=100
Text="RAM [mRAMGB:1]/[mRAMTotalGB:0]GB"
DynamicVariables=1
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS
;-------------------------------------------------------------
; AutoScale is used where the metric is genuinely dynamic (CPU load) so
; small changes stay visible. RAM is excluded because it sits nearly
; constant - AutoScale would rescale to its own min/max every frame and
; pin the line near the top, making 17% look almost full. Fixed 0-100
    ; keeps 17% looking like 17%.

; 1. Shaded area fills (Drawn first)
[CPUHistogramArea]
Meter=Histogram
MeasureName=mCPU
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[RAMHistogramArea]
Meter=Histogram
MeasureName=mRAMPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[CPUHistogram]
Meter=Line
MeasureName=mCPU
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=1
AntiAlias=1

[RAMHistogram]
Meter=Line
MeasureName=mRAMPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AntiAlias=1

;-------------------------------------------------------------
; LABELS are inline with the values above, so there are no
; separate icon meters - this keeps the pair centred as one unit.
-------------------------------------------------------------