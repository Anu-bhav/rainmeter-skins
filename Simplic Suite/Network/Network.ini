[Rainmeter]
Update=1000
Author= - HipHopium -
DynamicWindowSize=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

[mNetworkIn]
Measure=NetIn
AverageSize=5
UseBits=1
Interface=Best

[mNetworkOut]
Measure=NetOut
AverageSize=5
UseBits=1
Interface=Best

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; SPEEDS
;-------------------------------------------------------------
; Centred as a pair: each group is centred on the 1/4 and 3/4 lines so
; the pair is always centred across the full 250px, whatever the digits.

[DownloadText]
Meter=String
MeasureName=mNetworkIn
FontFace=#FontFace#
FontColor=#FontColor1#
FontSize=11
StringStyle=Bold
StringAlign=Center
X=62
Y=100
AutoScale=2
Text=%1bps
AntiAlias=1

[UploadText]
Meter=String
MeasureName=mNetworkOut
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=11
StringStyle=Bold
StringAlign=Center
X=187
Y=100
AutoScale=2
Text=%1bps
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS (Independent Auto-Scaling)
;-------------------------------------------------------------

; 1. Shaded area fills (Drawn first)
[DownloadHistogramArea]
Meter=Histogram
MeasureName=mNetworkIn
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[UploadHistogramArea]
Meter=Histogram
MeasureName=mNetworkOut
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AutoScale=1
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[DownloadHistogram]
Meter=Line
MeasureName=mNetworkIn
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=1
AntiAlias=1

[UploadHistogram]
Meter=Line
MeasureName=mNetworkOut
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AutoScale=1
AntiAlias=1

;-------------------------------------------------------------
; ICONS (Wingdings 3)
;-------------------------------------------------------------
; Positioned just left of each centred value group.

[DownloadText1]
Meter=String
FontFace=Wingdings 3
StringStyle=Bold
FontColor=#FontColor1#
FontSize=17
X=30
Y=95
Text="q"
AntiAlias=1

[UploadText1]
Meter=String
FontFace=Wingdings 3
StringStyle=Bold
FontColor=#FontColor2#
FontSize=17
X=155
Y=95
Text="p"
AntiAlias=1