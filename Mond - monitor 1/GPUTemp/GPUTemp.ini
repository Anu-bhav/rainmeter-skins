[Rainmeter]
Update=1000
Author=Mond
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; GPU Temperature via nvidia-smi (NVIDIA)
[mGPUTemp]
Measure=Plugin
Plugin=RunCommand
Program=nvidia-smi
Parameter="--query-gpu=temperature.gpu --format=csv,noheader,nounits -i #GPUIndex#"
State=Hide
OutputType=Output
RegExpSubstitute=1
Substitute="^(\d+\.?\d*).*$":"\1","^$":"0"
DynamicVariables=1
UpdateDivider=10

; GPU Temperature percentage (for graph, assuming max 100°C)
[mGPUTempPercent]
Measure=Calc
Formula=(mGPUTemp / 100 * 100)
MinValue=0
MaxValue=100

; CPU Temperature via PowerShell WMI
[mCPUTemp]
Measure=Plugin
Plugin=RunCommand
Program=powershell
Parameter="-Command \"try { (Get-WmiObject MSAcpi_ThermalZoneTemperature -Namespace root/wmi | Select -Expand CurrentTemperature -First 1) / 10 - 273.15 } catch { 0 }\""
State=Hide
OutputType=Output
RegExpSubstitute=1
Substitute="^(\d+\.?\d*).*$":"\1","^$":"0"
DynamicVariables=1
UpdateDivider=10

; Fallback: CoreTemp plugin (if CoreTemp is installed)
[mCPUTempCoreTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=Temperature
CoreTempIndex=0
Disabled=1

; CPU Temperature percentage (for graph, assuming max 100°C)
[mCPUTempPercent]
Measure=Calc
Formula=(mCPUTemp + mCPUTempCoreTemp)
MinValue=0
MaxValue=100

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; READOUT
;-------------------------------------------------------------
; A single centred String meter for both temps

[Readout]
Meter=String
MeasureName=mGPUTemp
MeasureName2=mCPUTemp
MeasureName3=mCPUTempCoreTemp
FontFace=#FontFace#
FontSize=11
StringStyle=Bold
FontColor=#FontColor1#
StringAlign=Center
X=125
Y=100
DynamicVariables=1
Text="GPU %1°C    CPU %2°C"
InlineSetting=Color | #FontColor2#
InlinePattern=CPU.*
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS
;-------------------------------------------------------------
; GPU graph (cyan)
[GPUHistogramArea]
Meter=Histogram
MeasureName=mGPUTempPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[GPUHistogram]
Meter=Line
MeasureName=mGPUTempPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor1#
LineWidth=4
AutoScale=1
AntiAlias=1

; CPU graph (magenta)
[CPUHistogramArea]
Meter=Histogram
MeasureName=mCPUTempPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AntiAlias=1

[CPUHistogram]
Meter=Line
MeasureName=mCPUTempPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor2#
LineWidth=4
AntiAlias=1