
[Rainmeter]
Update=1000
Author=Connect-R
DynamicWindowSize=1
AccurateText=1
MouseOverAction=[!SetTransparency 255]
MouseLeaveAction=[!SetTransparency 100]

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\#Language#.inc
Scale=4.4

; --- COLORS ---
ClockColor=100,100,100
AlphaTextColor=100

; --- ADVANCED SHADOW SCALING ---
ShadowX=(-1 * #Scale#)
ShadowY=(2 * #Scale#)
ShadowBlur=(1 * #Scale#)

; --- SHADOW COLOR ---
ShadowColor=200,60,180,140

[MeasureDay]
Measure=Time
Format=%A
Substitute=#Date#

[MeterBackground]
Meter=Image
SolidColor=0,0,0,10
X=0
Y=0
W=(492*#Scale#)
H=(75*#Scale#)

[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=Center
StringCase=Upper
FontFace=Anurati
FontColor=#ClockColor#,#AlphaTextColor#
FontSize=(52*#Scale#)
X=(246*#Scale#)
Y=(27*#Scale#)
Text="%1"
InlineSetting=CharacterSpacing | 10 | 10
InlineSetting2=Shadow | #ShadowX# | #ShadowY# | #ShadowBlur# | #ShadowColor#
TransformationMatrix=1;0;0;1.15;0;-10
AntiAlias=1
DynamicVariables=1

