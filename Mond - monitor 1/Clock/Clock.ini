[Rainmeter]
Update=1000
Author=Connect-R
DynamicWindowSize=1
AccurateText=1
MouseOverAction=[!SetTransparency 255]
MouseLeaveAction=[!SetTransparency 100]

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\#Language#.inc
Scale=4.4

; --- COLORS ---
ClockColor=100,100,100
AlphaTextColor=100

; --- ADVANCED SHADOW SCALING ---
ShadowX=(-1 * #Scale#)
ShadowY=(2 * #Scale#)
ShadowBlur=(1 * #Scale#)

; --- SHADOW COLOR ---
ShadowColor=200,60,180,140

; --- LETTER SPACING ---
; Anurati's glyphs vary 10x in width (I=32px, W=324px at this size), so
; CharacterSpacing cannot produce even gaps. Each letter is instead drawn in
; its own fixed-width slot and centred, which makes the spacing even by
; construction. See letters.lua for the measurements.
FontSize=(52*#Scale#)
; Slot is derived at runtime from the widest glyph in the day name; these are
; the base gap and left offset.
Gap=(12 * #Scale#)
OriginX=(30 * #Scale#)

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

[MeasureDay]
Measure=Time
Format=%A
Substitute=#Date#

; Splits the day name into per-letter variables and positions.
[mLetters]
Measure=Script
ScriptFile=#CURRENTPATH#letters.lua
DynamicVariables=1

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterBackground]
Meter=Image
SolidColor=0,0,0,10
X=0
Y=0
W=(492*#Scale#)
H=(75*#Scale#)

; One meter per letter. All share MeterBase and are positioned by X only.
[MeterBase]
Meter=String
FontFace=Anurati
FontSize=#FontSize#
FontColor=#ClockColor#,#AlphaTextColor#
StringStyle=Bold
StringAlign=Center
AntiAlias=1
DynamicVariables=1
InlineSetting2=Shadow | #ShadowX# | #ShadowY# | #ShadowBlur# | #ShadowColor#

; 9 slots covers WEDNESDAY, the longest day name.
[MeterDay1]
Meter=String
MeterStyle=MeterBase
X=[#DayX1]
Y=(27*#Scale#)
Text="[#Day1]"
[MeterDay2]
Meter=String
MeterStyle=MeterBase
X=[#DayX2]
Y=(27*#Scale#)
Text="[#Day2]"
[MeterDay3]
Meter=String
MeterStyle=MeterBase
X=[#DayX3]
Y=(27*#Scale#)
Text="[#Day3]"
[MeterDay4]
Meter=String
MeterStyle=MeterBase
X=[#DayX4]
Y=(27*#Scale#)
Text="[#Day4]"
[MeterDay5]
Meter=String
MeterStyle=MeterBase
