[Rainmeter]
Update=1000
Author=Anu-Bhav ; https://github.com/Anu-bhav/rainmeter-skins
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

; Measures aggregate average CPU load across all logical threads
[mCPU]
Measure=CPU

; Measures actual bytes of RAM used
[mRAMBytes]
Measure=PhysicalMemory

; Measures total usable RAM capacity on the system
[mRAMTotal]
Measure=PhysicalMemory
Total=1

; Used RAM, bytes -> GiB
[mRAMGB]
Measure=Calc
Formula=Trunc(mRAMBytes / 1073741824 * 10 + 0.5) / 10

; Total RAM, bytes -> GiB
[mRAMTotalGB]
Measure=Calc
Formula=Trunc(mRAMTotal / 1073741824 * 10 + 0.5) / 10

; RAM used as a percentage of the total
[mRAMPercent]
Measure=Calc
Formula=(mRAMBytes / mRAMTotal * 100)
MinValue=0
MaxValue=100

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; READOUT
;-------------------------------------------------------------
; A single centred String meter, so the whole line is centred by
; construction. Centring two separate meters on their own quarter points
; does NOT centre the pair: "CPU 5%" is narrow while "RAM 11.2/64GB" is
; wide, so the visual block drifts right of centre.
;
; X=125 is the centre of the 250px skin. Inline colour recolours the
; second half magenta without needing a second meter.

[Readout]
Meter=String
MeasureName=mCPU
MeasureName2=mRAMGB
MeasureName3=mRAMTotalGB
FontFace=#FontFace#
FontSize=11
StringStyle=Bold
FontColor=#FontColor1#
StringAlign=Center
X=125
Y=100
DynamicVariables=1
Text="CPU %1%    RAM %2/%3GB"
InlineSetting=Color | #FontColor2#
InlinePattern=RAM.*
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS
;-------------------------------------------------------------
; AutoScale is used where the metric is genuinely dynamic (CPU load) so
; small changes stay visible. RAM is excluded because it sits nearly
; constant - AutoScale would rescale to its own min/max every frame and
; pin the line near the top, making 17% look almost full. Fixed 0-100
    ; keeps 17% looking like 17%.

; 1. Shaded area fills (Drawn first)
[CPUHistogramArea]
Meter=Histogram
MeasureName=mCPU
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[RAMHistogramArea]
Meter=Histogram
MeasureName=mRAMPercent
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[CPUHistogram]
Meter=Line
MeasureName=mCPU
X=35
Y=0
W=180
H=80
LineColor=#FontColor1_Neon#
LineWidth=4
AutoScale=1
AntiAlias=1

[RAMHistogram]
Meter=Line
MeasureName=mRAMPercent
X=35
Y=0
W=180
H=80
LineColor=#FontColor2_Neon#
LineWidth=4
AntiAlias=1

;-------------------------------------------------------------
; LABELS are inline with the values above, so there are no
; separate icon meters - this keeps the pair centred as one unit.
-------------------------------------------------------------