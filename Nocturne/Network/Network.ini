[Rainmeter]
Update=1000
Author=Anu-Bhav ; https://github.com/Anu-bhav/rainmeter-skins
DynamicWindowSize=1

[Variables]
@include=#@#Variables.inc

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

[mNetworkIn]
Measure=NetIn
AverageSize=5
UseBits=1
Interface=Best

[mNetworkOut]
Measure=NetOut
AverageSize=5
UseBits=1
Interface=Best

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

;-------------------------------------------------------------
; SPEEDS
;-------------------------------------------------------------
; A single centred String meter, so the whole line is centred by
; construction. The Wingdings arrows are part of the same string (via
; an inline font change) rather than separate meters, which is what
; made them overlap the values before.
;
; X=125 is the centre of the 250px skin. The two halves are coloured
; independently with inline settings.

[Readout]
Meter=String
MeasureName=mNetworkIn
MeasureName2=mNetworkOut
FontFace=#FontFace#
FontSize=11
StringStyle=Bold
FontColor=#FontColor1#
StringAlign=Center
X=125
Y=100
AutoScale=2
DynamicVariables=1
Text="q %1bps    p %2bps"
InlineSetting=Face | Wingdings 3
InlinePattern=q
InlineSetting2=Color | #FontColor2#
InlinePattern2=p .*bps
AntiAlias=1

;-------------------------------------------------------------
; GRAPHS (Independent Auto-Scaling)
;-------------------------------------------------------------

; 1. Shaded area fills (Drawn first)
[DownloadHistogramArea]
Meter=Histogram
MeasureName=mNetworkIn
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor1_Area#
AutoScale=1
AntiAlias=1

[UploadHistogramArea]
Meter=Histogram
MeasureName=mNetworkOut
X=35
Y=0
W=180
H=80
PrimaryColor=#FontColor2_Area#
AutoScale=1
AntiAlias=1

; 2. Crisp overlay lines (Drawn second)
[DownloadHistogram]
Meter=Line
MeasureName=mNetworkIn
X=35
Y=0
W=180
H=80
LineColor=#FontColor1_Neon#
LineWidth=4
AutoScale=1
AntiAlias=1

[UploadHistogram]
Meter=Line
MeasureName=mNetworkOut
X=35
Y=0
W=180
H=80
LineColor=#FontColor2_Neon#
LineWidth=4
AutoScale=1
AntiAlias=1

;-------------------------------------------------------------
; LABELS are inline with the values above (Wingdings arrows are
; rendered via an inline font change), so there are no separate
; icon meters to overlap the numbers.
-------------------------------------------------------------