[Rainmeter]
Update=1000
Author=Anu-Bhav (based on Clock by Connect-R) ; https://github.com/Anu-bhav/rainmeter-skins
DynamicWindowSize=1
AccurateText=1
MouseOverAction=[!SetTransparency 255]
MouseLeaveAction=[!SetTransparency 100]

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\#Language#.inc
Scale=4.4
BgWidth=492

; Dynamic background width, in skin pixels. letters.lua recomputes this per
; day from the measured word width (DayWordW = word ink width + padding) and
; pushes it into this skin variable at runtime; [MeterBackground] reads it via
; W=#DayWordW#. The value here is only the pre-first-update fallback.
DayWordW=1500

; Dynamic background height, in skin pixels. letters.lua recomputes this per
; render from the cap ink height + padding (DayH) and pushes it into this skin
; variable at runtime; [MeterBackground] reads it via H=#DayH#. Fallback =
; the nominal full panel height (75 * 4.4 = 330).
DayH=330

; --- COLORS ---
ClockColor=100,100,100
AlphaTextColor=100

; --- ADVANCED SHADOW SCALING ---
; These are used by the Shadow inline setting below. Values are plain
; formulas - Rainmeter evaluates them (verified).
ShadowX=(-1 * #Scale#)
ShadowY=(2 * #Scale#)
ShadowBlur=(2 * #Scale#)

; --- SHADOW COLOR ---
; Alpha 255 is required for the glow to be visible. Rainmeter MULTIPLIES the
; shadow's alpha by the string's alpha, so with AlphaTextColor=100 the shadow
; can only ever reach 39% of its own alpha. At the old 140 that came out at
; ~21%, and the idle window transparency (100/255) then dimmed it to ~8% -
; effectively invisible.
ShadowColor=200,60,180,255

; --- LETTER SPACING ---
; Anurati's glyphs vary 10x in width (I=37px, W=329px at this size), so
; CharacterSpacing cannot produce even gaps. On top of that the ink is not
; centred inside each glyph's advance box, so centring by advance width lets
; A and Y touch in "DAY". Each letter is therefore positioned by its measured
; ink extent: every glyph starts exactly #Gap# px after the previous one's ink
; ends, which makes the gaps even by construction. See letters.lua.

; Font size (in points, scaled by #Scale#) chosen so the longest day name,
; WEDNESDAY, fits inside the background meter once centred. At 52*#Scale#
; (228.8pt) WEDNESDAY overflowed the meter; 42*#Scale# (184.8pt) fits with a
; small margin, and the day name is then centred via letters.lua.
FontSize=(42*#Scale#)
; Ink-to-ink gap between consecutive letters, and the x where the first
; glyph's ink begins.
Gap=(12 * #Scale#)
OriginX=(30 * #Scale#)

; Vertical pen position for the day name.
; Anurati has a large ascent gap: with the pen at Y=(27*Scale) the visible cap
; ink does not begin until ~43px lower, which pushed the text 80px below the
; background panel. With the pen at the top of the panel the ink sits inside it.
TextY=(0*#Scale#)

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------

[MeasureDay]
Measure=Time
Format=%A
Substitute=#Date#

; Splits the day name into per-letter variables and positions.
[mLetters]
Measure=Script
ScriptFile=#CURRENTPATH#letters.lua
DynamicVariables=1

;-------------------------------------------------------------
; METERS
;-------------------------------------------------------------

[MeterBackground]
Meter=Image
SolidColor=0,0,0,10
X=0
Y=0
; Required for the DayWordW/DayH skin variables pushed by letters.lua to be
; re-read at runtime; without it the panel keeps its load-time size and can end
; before the last letter (e.g. the Y in MONDAY).
DynamicVariables=1
W=#DayWordW#
H=#DayH#

; One meter per letter. Each is drawn with StringAlign=Left so the PEN sits at X;
; letters.lua then positions each pen so the visible ink starts exactly #Gap# px
; after the previous glyph's ink ends. See letters.lua.
[MeterBase]
Meter=String
FontFace=Anurati
FontSize=#FontSize#
FontColor=#ClockColor#,#AlphaTextColor#
StringStyle=Bold
StringAlign=Left
AntiAlias=1
DynamicVariables=1
; ---------------------------------------------------------------------
; The shadow MUST be InlineSetting (slot 1). InlineSetting*N* numbering may
; not contain gaps: using InlineSetting2 on its own (with no InlineSetting)
; makes Rainmeter discard the whole inline block and the glow silently
; disappears. That is exactly what happened when the single [MeterDay]
; meter was split into per-letter meters and only InlineSetting2 was kept.
; ---------------------------------------------------------------------
InlineSetting=Shadow | #ShadowX# | #ShadowY# | #ShadowBlur# | #ShadowColor#

; 9 slots covers WEDNESDAY, the longest day name.
[MeterDay1]
Meter=String
MeterStyle=MeterBase
X=[#DayX1]
Y=#TextY#
Text="[#Day1]"
[MeterDay2]
Meter=String
MeterStyle=MeterBase
X=[#DayX2]
Y=#TextY#
Text="[#Day2]"
[MeterDay3]
Meter=String
MeterStyle=MeterBase
X=[#DayX3]
Y=#TextY#
Text="[#Day3]"
[MeterDay4]
Meter=String
MeterStyle=MeterBase
X=[#DayX4]
Y=#TextY#
Text="[#Day4]"
[MeterDay5]
Meter=String
MeterStyle=MeterBase
X=[#DayX5]
Y=#TextY#
Text="[#Day5]"
[MeterDay6]
Meter=String
MeterStyle=MeterBase
X=[#DayX6]
Y=#TextY#
Text="[#Day6]"
[MeterDay7]
Meter=String
MeterStyle=MeterBase
X=[#DayX7]
Y=#TextY#
Text="[#Day7]"
[MeterDay8]
Meter=String
MeterStyle=MeterBase
X=[#DayX8]
Y=#TextY#
Text="[#Day8]"
[MeterDay9]
Meter=String
MeterStyle=MeterBase
X=[#DayX9]
Y=#TextY#
Text="[#Day9]"
